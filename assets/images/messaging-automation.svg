<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Messaging automation</title>
<desc id="desc">A phone with a fictional enquiry, automated reply and human handoff option. Fictional illustrative example, not a Waviq product screenshot or customer result.</desc>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="640" height="420" rx="24" fill="#f3f8fc" stroke="none"/><circle cx="599" cy="389" r="60" fill="#e1f5ee"/><rect x="128" y="16" width="384" height="390" rx="30" fill="#042c53" stroke="none"/><rect x="140" y="28" width="360" height="366" rx="22" fill="white" stroke="none"/><rect x="250" y="28" width="140" height="15" rx="7" fill="#042c53" stroke="none"/><text x="166" y="79" font-size="23" fill="#042c53" font-weight="700">Sample conversation</text><circle cx="470" cy="71" r="6" fill="#0f6e56"/><rect x="160" y="103" width="273" height="68" rx="12" fill="#f3f8fc" stroke="none"/><text x="178" y="131" font-size="21" fill="#042c53" font-weight="500">Hello! How can we help?</text><text x="178" y="156" font-size="17" fill="#0f6e56" font-weight="500">Automated reply</text><rect x="232" y="186" width="244" height="48" rx="12" fill="#0f6e56" stroke="none"/><text x="250" y="217" font-size="20" fill="white" font-weight="500">I’d like a consultation.</text><rect x="160" y="249" width="306" height="72" rx="12" fill="#f3f8fc" stroke="none"/><text x="178" y="278" font-size="21" fill="#042c53" font-weight="500">Of course. Choose a time</text><text x="178" y="304" font-size="21" fill="#042c53" font-weight="500">or speak with our team.</text><rect x="160" y="338" width="144" height="36" rx="12" fill="#e1f5ee" stroke="none"/><text x="179" y="363" font-size="19" fill="#0f6e56" font-weight="500">View times</text><rect x="316" y="338" width="160" height="36" rx="12" fill="#f3f8fc" stroke="none"/><text x="332" y="363" font-size="19" fill="#042c53" font-weight="500">Talk to team</text></g>
</svg>
